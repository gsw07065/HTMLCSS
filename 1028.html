<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1028</title>
  <link rel="stylesheet" href="reset.css">
  <style>
    body{height: 5000px;}
    .quickmenu{
      position: absolute;
      right: 50px; top: 120px;
      width: 100px; height: 300px;
      background: #ccc;
    }
  </style>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script>
    $(function(){
      $(window).scroll(function(){
        let scrtop = $(document).scrollTop();
        console.log(scrtop);
        if(scrtop>0){
          $(".quickmenu").stop().animate({top:scrtop + 120 + "px"}, 500);
        }
      })
    });
  </script>
</head>
<body>
  <div class="quickmenu"></div>
  <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d568.0680536369955!2d127.37700931118694!3d36.349194701813154!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x35654be14ac762f3%3A0xeb905080ab28e9bf!2z7Jik65287YG0QkQ!5e0!3m2!1sko!2skr!4v1730101233777!5m2!1sko!2skr" width="800" height="550" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
</body>
</html>
